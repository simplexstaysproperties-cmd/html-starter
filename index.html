<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplex Stays Ltd | Dollis Hill Serviced Accommodation & Romford RM6 Rooms</title>
  <meta name="description" content="Simplex Stays Ltd offers polished Dollis Hill serviced accommodation in North West London and long-term double rooms to rent in Romford RM6." />
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --surface-tint: #eef3f9;
      --text: #0d1833;
      --muted: #5c6d87;
      --border: #dbe5f0;
      --navy: #071738;
      --navy-2: #102856;
      --navy-3: #1f4b8f;
      --accent: #ccb06f;
      --accent-2: #ead7aa;
      --green: #25D366;
      --shadow: 0 26px 80px rgba(7, 23, 56, 0.14);
      --shadow-soft: 0 14px 38px rgba(7, 23, 56, 0.08);
      --radius: 24px;
      --radius-lg: 34px;
      --max: 1200px;
      --header-height: 108px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      line-height: 1.6;
      background:
        radial-gradient(circle at top left, rgba(204,176,111,0.08) 0%, rgba(204,176,111,0) 26%),
        linear-gradient(180deg, #fbfcfe 0%, #f2f6fb 100%);
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    section[id] { scroll-margin-top: 200px; }

    .container {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: linear-gradient(90deg, rgba(12,33,72,0.97) 0%, rgba(33,76,136,0.95) 100%);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 28px rgba(7,23,56,0.16);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px 12px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.06) 100%);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 16px 34px rgba(7,23,56,0.16);
    }

    .brand-logo-wrap {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffffff 0%, #eef3f8 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 22px rgba(7,23,56,0.08);
      flex-shrink: 0;
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.02;
    }

    .brand-copy strong {
      color: white;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .brand-copy small {
      color: rgba(233,240,247,0.78);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.18em;
      margin-top: 6px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.22s ease;
    }

    .nav-links a:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.16);
    }

    /* ===== FIXED PREMIUM BANNER ===== */
    .top-banner {
      position: sticky;
      top: var(--header-height);
      z-index: 59;
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #e6cf94 0%, #d9bc73 100%);
      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .banner-link {
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      height:100%;
    }

    .banner-inner {
      font-weight:800;
      font-size:13px;
      transition:opacity 0.3s ease;
    }

    .top-banner.banner-text-hidden .banner-inner {
      opacity:0;
    }

    /* ===== REST OF YOUR ORIGINAL CSS UNCHANGED ===== */

  </style>
</head>
<body>

  <!-- YOUR FULL ORIGINAL HTML REMAINS EXACTLY THE SAME -->

  <div class="topbar">
    <div class="container nav">
      <div class="brand">
        <span class="brand-logo-wrap">
          <img src="simplex-logo.png.jpg" alt="Simplex Stays logo" />
        </span>
        <span class="brand-copy">
          <strong>Simplex Stays Ltd</strong>
          <small>Premium stays & room rentals</small>
        </span>
      </div>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#property">Dollis Hill</a>
        <a href="#dollis-gallery-grid">Dollis Gallery</a>
        <a href="#rooms">Romford Rooms</a>
        <a href="#reviews">Reviews</a>
        <a href="#faq">FAQ</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </div>

  <div class="top-banner">
    <a class="banner-link" href="#rooms">
      <div class="banner-inner">Looking for a room in Romford RM6? View available long-term double rooms here.</div>
    </a>
  </div>

  <!-- KEEP EVERYTHING ELSE IDENTICAL -->

  <script>
  const topBanner = document.querySelector('.top-banner');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 80) {
      topBanner.classList.add('banner-text-hidden');
    } else {
      topBanner.classList.remove('banner-text-hidden');
    }
  });
  </script>

</body>
</html>
