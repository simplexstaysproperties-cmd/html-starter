<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplex Stays</title>

<style>
:root {
  --header-height: 100px;
  --header-height-scrolled: 70px;
}

body { margin:0; font-family:Arial; }

/* HEADER */
.topbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #1e3a6d;
}

.nav {
  min-height: var(--header-height);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  color:white;
  transition: all 0.3s ease;
}

.topbar.scrolled .nav {
  min-height: var(--header-height-scrolled);
}

/* BANNER */
.top-banner {
  position: sticky;
  top: var(--header-height);
  height: 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(180deg,#e6cf94,#d9bc73);
  transition: all 0.3s ease;
  overflow:hidden;
}

.topbar.scrolled + .top-banner {
  top: var(--header-height-scrolled);
}

.top-banner.banner-text-hidden {
  height:16px;
}

.banner-inner {
  font-size:13px;
  font-weight:700;
  transition: all 0.3s ease;
}

.top-banner.banner-text-hidden .banner-inner {
  opacity:0;
  transform: translateY(-10px);
}

.content {
  height:2000px;
  padding:20px;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="nav">
    <div>Simplex Stays</div>
    <div>Home Rooms Contact</div>
  </div>
</div>

<div class="top-banner">
  <div class="banner-inner">Looking for a room in Romford? View available rooms here.</div>
</div>

<div class="content">Scroll down</div>

<script>
const banner = document.querySelector('.top-banner');
const header = document.querySelector('.topbar');

window.addEventListener('scroll', () => {
  if(window.scrollY > 30){
    banner.classList.add('banner-text-hidden');
    header.classList.add('scrolled');
  } else {
    banner.classList.remove('banner-text-hidden');
    header.classList.remove('scrolled');
  }
});
</script>

</body>
</html>
