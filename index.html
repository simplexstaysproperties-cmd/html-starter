<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplex Stays Ltd</title>

  <style>
    :root {
      --header-height: 108px;
      --header-height-scrolled: 64px; /* NEW */
      --banner-height: 34px;
    }

    body { margin:0; font-family:Arial, sans-serif; }

    /* TOPBAR */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(90deg, #0c2148, #214c88);
      transition: all 0.3s ease;
    }

    .nav {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      transition: all 0.3s ease; /* IMPORTANT */
    }

    /* SHRINK HEADER */
    .topbar.scrolled .nav {
      min-height: var(--header-height-scrolled);
    }

    .brand { color:white; font-weight:bold; font-size:22px; }

    .nav a {
      color:white;
      margin-left:15px;
      text-decoration:none;
      font-weight:600;
    }

    /* GOLD BANNER */
    .top-banner {
      position: sticky;
      top: var(--header-height);
      height: var(--banner-height);
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, #e6cf94, #d9bc73);
      transition: all 0.3s ease;
    }

    /* SHRINK BANNER */
    .top-banner.banner-text-hidden {
      height:18px;
    }

    /* CONTENT */
    .content {
      height:2000px;
      padding:20px;
      background:#f5f5f5;
    }

  </style>
</head>

<body>

  <div class="topbar">
    <div class="nav">
      <div class="brand">Simplex Stays</div>
      <div>
        <a href="#">Home</a>
        <a href="#">Rooms</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </div>

  <div class="top-banner">
    <div>Looking for a room in Romford? View available rooms here.</div>
  </div>

  <div class="content">Scroll to see effect</div>

  <script>
    const topBanner = document.querySelector('.top-banner');
    const topbar = document.querySelector('.topbar');

    window.addEventListener('scroll', () => {
      if (window.scrollY > 30) {
        topBanner.classList.add('banner-text-hidden');
        topbar.classList.add('scrolled');
      } else {
        topBanner.classList.remove('banner-text-hidden');
        topbar.classList.remove('scrolled');
      }
    });
  </script>

</body>
</html>
