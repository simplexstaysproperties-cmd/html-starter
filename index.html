<style>
:root {
  --header-height: 108px;
  --header-height-scrolled: 64px; /* NEW */
  --banner-height: 34px;
}

.nav {
  min-height: var(--header-height);
  transition: all 0.3s ease; /* NEW */
}

/* HEADER SHRINK */
.topbar.scrolled .nav {
  min-height: var(--header-height-scrolled);
}

/* BANNER BASE */
.top-banner {
  position: sticky;
  top: var(--header-height);
  z-index: 59;
  width: 100%;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #e6cf94 0%, #d9bc73 100%);
  transition: all 0.3s ease;
  overflow: hidden;
}

/* MOVE WITH HEADER */
.topbar.scrolled + .top-banner {
  top: var(--header-height-scrolled);
}

/* SHRINK BANNER */
.top-banner.banner-text-hidden {
  height: 16px;
}

/* TEXT STYLE */
.banner-inner {
  font-weight: 800;
  font-size: 13px;
  line-height: 1;
  padding: 4px 10px;
  transition: all 0.3s ease;
}

/* HIDE TEXT COMPLETELY */
.top-banner.banner-text-hidden .banner-inner {
  opacity: 0;
  transform: translateY(-10px);
  pointer-events: none;
}
</style>

<script>
const topBanner = document.querySelector('.top-banner');
const topbar = document.querySelector('.topbar');

window.addEventListener('scroll', () => {
  if (window.scrollY > 30) {
    topBanner.classList.add('banner-text-hidden');
    topbar.classList.add('scrolled');
  } else {
    topBanner.classList.remove('banner-text-hidden');
    topbar.classList.remove('scrolled');
  }
});
</script>
