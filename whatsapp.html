<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Simplex Stays Ltd</title>

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e3a5f);
  color: white;
  text-align: center;
}

/* container */
.container {
  max-width: 900px;
  margin: auto;
  padding: 60px 20px;
}

/* logo section */
.logo {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 10px;
}

/* subtitle */
.subtitle {
  color: #cbd5e1;
  margin-bottom: 40px;
}

/* card */
.card {
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* buttons */
.btn {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 14px auto;
  padding: 16px;
  border-radius: 14px;
  font-weight: bold;
  text-decoration: none;
  transition: 0.2s;
}

/* whatsapp */
.whatsapp {
  background: #25D366;
  color: white;
}

.whatsapp:hover {
  opacity: 0.9;
}

/* call */
.call {
  background: white;
  color: #0f172a;
}

.call:hover {
  background: #f1f5f9;
}

/* back */
.back {
  background: #d4af37;
  color: black;
  margin-top: 30px;
}

.back:hover {
  opacity: 0.9;
}

/* info text */
.info {
  margin-top: 20px;
  font-size: 14px;
  color: #cbd5e1;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Simplex Stays Ltd</div>
  <div class="subtitle">Fastest way to book or enquire</div>

  <div class="card">

    <h2>Speak to us directly</h2>
    <p class="subtitle">Quick response for bookings, availability and viewings</p>

    <!-- WhatsApp -->
    <a href="https://wa.me/447908389184" target="_blank" class="btn whatsapp">
      Message on WhatsApp
    </a>

    <!-- Call -->
    <a href="tel:+447946649402" class="btn call">
      Call Now
    </a>

    <div class="info">
      WhatsApp: 07908 389184<br>
      Call: 07946 649402
    </div>

    <!-- Back to site -->
    <a href="index.html" class="btn back">
      ← Back to Website
    </a>

  </div>

</div>

</body>
</html>
